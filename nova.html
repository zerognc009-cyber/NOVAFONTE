<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nova.css">
    <title>NOVA FONTE | Melhor loja</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        body {
            background-color: #121212;
        }

        /* Cabeçalho Preto Premium */
        .premium-header {
            background-color: #000000;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: slideDown 0.8s ease-out;
        }

        .logo-container {
            flex: 1;
            display: flex;
            align-items: center;
            animation: fadeIn 1s ease-out forwards;
        }

        .logo-img {
            max-height: 90px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .logo-img:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .search-container {
            flex: 2;
            display: flex;
            justify-content: center;
            animation: fadeIn 1.2s ease-out forwards;
        }

        .search-wrapper {
            width: 100%;
            max-width: 550px;
        }

        .search-bar {
            width: 100%;
            padding: 16px 25px;
            background: #050505;
            border: 1px solid #222;
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-bar:focus {
            border-color: #fff;
            background: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2), 0 0 10px rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        @keyframes glowPulse {
            0% { border-color: #222; }
            50% { border-color: #444; }
            100% { border-color: #222; }
        }

        .search-bar {
            animation: glowPulse 3s infinite ease-in-out;
        }

        .nav-right-placeholder {
            flex: 1;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- FILTRO --- */
        .filtro-grupo {
            width: 100%;
            margin-bottom: 10px;
        }

        .filtro-dropdown {
            max-height: 0;
            overflow: hidden;
            background: #0a0a0a;
            transition: max-height 0.4s ease-out;
            display: flex;
            flex-direction: column;
            border-radius: 0 0 8px 8px;
        }

        .filtro-dropdown.aberto {
            max-height: 400px;
            border: 1px solid #222;
            border-top: none;
            padding-bottom: 10px;
        }

        .filtro-dropdown a {
            color: #888;
            text-decoration: none;
            padding: 12px 25px;
            font-size: 13px;
            font-weight: 800;
            transition: 0.3s;
            text-align: left;
        }

        .filtro-dropdown a:hover {
            color: #fff;
            background: #111;
            padding-left: 30px;
        }

        .seta-f {
            transition: transform 0.3s ease;
            display: inline-block;
            font-size: 18px;
            color: #555;
        }

        .seta-f.rodar {
            transform: rotate(90deg);
            color: #fff;
        }

        /* --- MODAL PRODUTO --- */
        .product-modal-premium {
            display: none;
            position: fixed;
            top: 100px; 
            left: 0;
            width: 100%;
            height: calc(100% - 100px);
            background: #000;
            z-index: 1500;
            overflow-y: auto;
            animation: painelSubir 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .product-modal-premium.saindo {
            animation: painelDescendo 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes painelSubir {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes painelDescendo {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(50px); opacity: 0; }
        }

        .galeria-produto-p {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .miniaturas-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mini-foto {
            width: 70px;
            height: 70px;
            border: 1px solid #222;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            object-fit: cover;
            opacity: 0.6;
        }

        .mini-foto:hover, .mini-foto.active {
            border-color: #fff;
            opacity: 1;
        }

        .foto-principal-p {
            flex: 1;
        }

        .modal-container-p {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 5%;
            position: relative;
        }

        .btn-fechar-p {
            position: absolute;
            top: 10px; right: 5%;
            background: none; border: none;
            color: #fff; font-size: 45px;
            cursor: pointer; z-index: 10;
        }

        .modal-grid-p {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 60px;
            align-items: start;
        }

        .lado-foto-p img {
            width: 100%;
            border-radius: 4px;
            animation: fadeIn 1s ease;
        }

        .lado-info-p {
            text-align: left;
            animation: surgirDir 0.7s ease;
        }

        @keyframes surgirDir {
            from { transform: translateX(40px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .m-breadcrumb { font-size: 12px; color: #666; margin-bottom: 10px; text-transform: none; font-weight: 400; }
        .m-titulo { font-size: 34px; color: #fff; margin-bottom: 15px; font-weight: 800; line-height: 1.1; }
        .m-preco { font-size: 24px; color: #fff; margin-bottom: 5px; }
        .m-pix { font-size: 20px; color: #fff; margin-bottom: 5px; }
        .m-parcela { font-size: 14px; color: #888; margin-bottom: 25px; font-weight: 400; }

        .m-label { font-size: 13px; color: #fff; margin-bottom: 12px; }
        .m-tamanhos { display: flex; gap: 10px; margin-bottom: 35px; }
        .t-btn {
            width: 50px; height: 50px;
            border: 1px solid #333;
            background: #000; color: #fff;
            cursor: pointer; font-weight: 800;
            transition: 0.3s;
        }
        .t-btn:hover, .t-btn.active { background: #fff; color: #000; border-color: #fff; transform: translateY(-3px); }

        .btn-comprar-p {
            width: 100%;
            padding: 22px;
            background: #fff; color: #000;
            border: none; font-weight: 800;
            font-size: 18px; cursor: pointer;
            transition: 0.3s;
        }
        .btn-comprar-p:active { transform: scale(0.97); }

        /* --- CARRINHO LATERAL --- */
        .carrinho-lateral {
            position: fixed;
            top: 0; right: -100%;
            width: 350px; height: 100vh;
            background: #000; border-left: 1px solid #222;
            z-index: 3000; transition: 0.4s ease-in-out;
            padding: 20px;
        }
        .carrinho-lateral.active { right: 0; }
        .cart-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; z-index: 2900;
        }
        .cart-overlay.active { display: block; }
        
        /* --- AVISO NO CANTO INFERIOR (Para não atrapalhar nada) --- */
        #aviso-custom {
            position: fixed;
            bottom: 20px; 
            right: -400px; /* Começa fora da tela */
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 15px 25px;
            font-weight: 800;
            font-size: 13px;
            z-index: 5000;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #aviso-custom.show {
            right: 20px; /* Desliza para dentro */
        }

        @media (max-width: 768px) {
            .premium-header { min-height: 80px; }
            .product-modal-premium { top: 165px; height: calc(100% - 165px); }
            .modal-grid-p { grid-template-columns: 1fr; gap: 30px; }
            .m-titulo { font-size: 24px; }
            .galeria-produto-p { flex-direction: column-reverse; }
            .miniaturas-col { flex-direction: row; overflow-x: auto; padding-bottom: 10px; }
            .mini-foto { width: 60px; height: 60px; }
            .carrinho-lateral { width: 100%; }
            #aviso-custom { bottom: 85px; right: -100%; width: 90%; left: 5%; transform: none; }
            #aviso-custom.show { right: auto; left: 5%; }
        }
    </style>
</head>
<body>

    <header class="premium-header">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img" onclick="window.location.reload()">
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <input type="text" class="search-bar" placeholder="BUSCAR PRODUTOS">
            </div>
        </div>

        <div class="cart-button-container">
    <button class="cart-icon-btn" onclick="toggleCarrinho()" title="Carrinho">
        <svg class="cart-icon-svg" viewBox="0 0 24 24">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span id="cart-count">0</span>
    </button>
</div>
    </header>

    <nav class="sub-nav">
    <ul class="nav-list" id="navListMain">
        <li><a href="#" class="nav-link">Início</a></li>
        <li><a href="javascript:void(0)" class="nav-link" onclick="abrirTodasRoupas()">Roupas</a></li>
        <li><a href="javascript:void(0)" class="nav-link" onclick="abrirAbaBones()">Bonés</a></li>
        <li><a href="javascript:void(0)" class="nav-link" onclick="abrirTodosTenis()">Tênis</a></li>
        <li><a href="#" class="nav-link">Contato</a></li>
    </ul>
</nav>

    <div id="productModal" class="product-modal-premium">
        <div class="modal-container-p">
            <button class="btn-fechar-p" onclick="closeProductModal()">×</button>
            <div id="productDetailsBody" class="modal-grid-p"></div>
        </div>
    </div>
        
    <section class="marcas-section">
        <div class="marcas-container">
            <div class="marcas-wrapper" id="marcasWrapper">
                <div class="marca-item" onclick="openBrand('NIKE')">
                    <img src="nike.webp" alt="Nike">
                </div>

<div class="marca-item" onclick="openBrand('HALPH')">
                    <img src="halph.webp" alt="HALPH">
                </div>

                <div class="marca-item" onclick="openBrand('CORTEIZ')">
                    <img src="corteiz.jpg" alt="CORTEIZ">
                </div>
                <div class="marca-item" onclick="openBrand('SYNA WORLD')">
                    <img src="syna.jfif" alt="SYNAWORLD">
                </div>
                 <div class="marca-item" onclick="openBrand('CHROME HEARTS')">
                    <img src="chrome.webp" alt="CHROME">
            

            </div>
        </div>
    </section>

    <section class="banner-container">
        <div class="banner-moldura">
            <img src="banner.png" alt="Destaque" class="img-zoom-suave">
        </div>
    </section>

    <div id="sidePanel" class="full-screen-panel">
        <div class="panel-header">
            <span id="panelTitle">MARCA</span>
            <button class="close-btn" onclick="togglePanel()">×</button>
        </div>
        <div class="panel-content" id="panelBody"></div>
    </div>

    <div id="overlay" class="overlay" onclick="togglePanel()"></div>

    <div id="aviso-custom"></div>

    <script>
        // 1. BANCO DE DADOS E ESTOQUE
// 1. BANCO DE DADOS
const produtosPorMarca = {
    
};

const estoqueSapatos = [
   
];

const estoqueConjuntos = [
    
];

const estoqueBones = [
    
];

// 2. MEMÓRIA E INICIALIZAÇÃO
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
let tamanhoSelecionado = "";

document.addEventListener('DOMContentLoaded', () => {
    atualizarContador();
    renderizarItensCarrinho();
    criarToastHTML(); // Cria o aviso de tela automaticamente
});

function salvarCarrinho() {
    localStorage.setItem('carrinho', JSON.stringify(carrinho));
    atualizarContador();
}

function atualizarContador() {
    const cartCount = document.getElementById('cart-count');
    if (cartCount) cartCount.innerText = carrinho.length;
}

// 3. AVISO (TOAST) PARA CELULAR E PC
function criarToastHTML() {
    if (!document.getElementById('toast-app')) {
        const toast = document.createElement('div');
        toast.id = 'toast-app';
        // Estilo direto para garantir que funcione
        toast.style = "position:fixed; bottom: -100px; left:50%; transform:translateX(-50%); background:#000; color:#fff; padding:12px 25px; border-radius:50px; font-size:13px; z-index:10000; transition:0.5s; border:1px solid #333; box-shadow:0 5px 15px rgba(0,0,0,0.5); white-space:nowrap;";
        document.body.appendChild(toast);
    }
}

function mostrarAviso(texto, erro = false) {
    const toast = document.getElementById('toast-app');
    toast.innerText = texto;
    toast.style.background = erro ? "#800000" : "#000";
    toast.style.bottom = "30px"; // Sobe a mensagem
    setTimeout(() => { toast.style.bottom = "-100px"; }, 2500); // Esconde
}

// 4. FUNÇÕES DE NAVEGAÇÃO (BOTÕES)
function openBrand(brand) {
    const title = document.getElementById('panelTitle');
    const body = document.getElementById('panelBody');
    title.innerText = brand;
    body.innerHTML = '<div class="vitrine-fluxo" id="vitrineGeneric"></div>';
    renderCards(produtosPorMarca[brand] || [], document.getElementById('vitrineGeneric'));
    showPanel();
}

function abrirTodasRoupas() {
    const title = document.getElementById('panelTitle');
    const body = document.getElementById('panelBody');
    title.innerText = "ROUPAS";
    body.innerHTML = '<div class="vitrine-fluxo" id="vitrineTotal"></div>';
    let todos = [];
    Object.values(produtosPorMarca).forEach(l => todos = todos.concat(l));
    renderCards(todos, document.getElementById('vitrineTotal'));
    showPanel();
}

function abrirTodosTenis() {
    const title = document.getElementById('panelTitle');
    const body = document.getElementById('panelBody');
    title.innerText = "TÊNIS";
    body.innerHTML = '<div class="vitrine-fluxo" id="vitrineT"></div>';
    renderCards(estoqueSapatos, document.getElementById('vitrineT'));
    showPanel();
}

function abrirAbaBones() {
    const title = document.getElementById('panelTitle');
    const body = document.getElementById('panelBody');
    title.innerText = "BONÉS";
    body.innerHTML = '<div class="vitrine-fluxo" id="vitrineB"></div>';
    renderCards(estoqueBones, document.getElementById('vitrineB'));
    showPanel();
}

function abrirAbaConjuntos() {
    const title = document.getElementById('panelTitle');
    const body = document.getElementById('panelBody');
    title.innerText = "CONJUNTOS";
    body.innerHTML = '<div class="vitrine-fluxo" id="vitrineC"></div>';
    renderCards(estoqueConjuntos, document.getElementById('vitrineC'));
    showPanel();
}

// 5. CARRINHO LOGICA
function adicionarAoCarrinho(nome, preco, img) {
    if (!tamanhoSelecionado) {
        mostrarAviso("⚠️ SELECIONE UM TAMANHO PRIMEIRO", true);
        return;
    }
    carrinho.push({ nome, preco, tamanho: tamanhoSelecionado, img, qtd: 1 });
    salvarCarrinho();
    renderizarItensCarrinho();
    mostrarAviso("✅ ADICIONADO COM SUCESSO");
    setTimeout(() => { toggleCarrinho(); }, 800);
}

function renderizarItensCarrinho() {
    const conteudo = document.getElementById('conteudoCarrinho');
    const rodape = document.getElementById('rodapeCarrinho');
    if (!conteudo) return;
    let subtotal = 0;

    if (carrinho.length > 0) {
        if (rodape) rodape.style.display = 'block';
        conteudo.innerHTML = "";
        carrinho.forEach((item, index) => {
            const p = parseFloat(item.preco.replace('R$', '').replace('.', '').replace(',', '.'));
            subtotal += (p * (item.qtd || 1));
            conteudo.innerHTML += `
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px; border-bottom:1px solid #111; padding-bottom:10px;">
                    <img src="${item.img}" style="width:60px;">
                    <div style="flex:1;">
                        <h4 style="color:#fff; font-size:11px; margin:0;">${item.nome}</h4>
                        <p style="color:#666; font-size:10px; margin:3px 0;">TAM: ${item.tamanho}</p>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <button onclick="alterarQtdCarrinho(${index}, -1)" style="background:#222; border:none; color:#fff; padding:2px 7px;">-</button>
                            <span style="color:#fff; font-size:11px;">${item.qtd || 1}</span>
                            <button onclick="alterarQtdCarrinho(${index}, 1)" style="background:#222; border:none; color:#fff; padding:2px 7px;">+</button>
                        </div>
                    </div>
                    <span style="color:#fff; font-size:11px; font-weight:bold;">${item.preco}</span>
                    <button onclick="removerItem(${index})" style="color:#444; background:none; border:none; font-size:18px;">&times;</button>
                </div>`;
        });
    } else {
        if (rodape) rodape.style.display = 'none';
        conteudo.innerHTML = `<div style="background:#fff; color:#000; padding:15px; text-align:center; font-weight:800; font-size:12px; margin-top:20px;">ⓘ CARRINHO VAZIO</div>`;
    }
    const sub = subtotal.toLocaleString('pt-br', { style: 'currency', currency: 'BRL' });
    if(document.getElementById('subtotalValor')) document.getElementById('subtotalValor').innerText = sub;
    if(document.getElementById('totalFinal')) document.getElementById('totalFinal').innerText = sub;
}

function alterarQtdCarrinho(i, m) {
    carrinho[i].qtd = (carrinho[i].qtd || 1) + m;
    if (carrinho[i].qtd < 1) return removerItem(i);
    salvarCarrinho();
    renderizarItensCarrinho();
}

function removerItem(i) {
    carrinho.splice(i, 1);
    salvarCarrinho();
    renderizarItensCarrinho();
}

// 6. MODAL E AUXILIARES
function openProductModal(prod) {

    
    const body = document.getElementById('productDetailsBody');
    const fotos = prod.fotos || [prod.img];
    let minis = '';
    fotos.forEach((f, i) => minis += `<img src="${f}" class="mini-foto ${i===0?'active':''}" onclick="trocarFoto(this, '${f}')">`);

    body.innerHTML = `
        <div class="lado-foto-p">
            <div class="galeria-produto-p">
                <div class="miniaturas-col">${minis}</div>
                <div class="foto-principal-p"><img src="${prod.img}" id="mainImg"></div>
            </div>
        </div>
        <div class="lado-info-p">
            <h1 class="m-titulo">${prod.nome}</h1>
            <div class="m-preco">${prod.preco}</div>
            <div class="m-pix">${prod.precoPix} com Pix</div>
            <div class="m-label">TAMANHOS:</div>
            <div class="m-tamanhos">
                ${prod.categoria === 'tenis' ? 
                '<button class="t-btn" onclick="selT(this)">38</button><button class="t-btn" onclick="selT(this)">39</button><button class="t-btn" onclick="selT(this)">40</button><button class="t-btn" onclick="selT(this)">41</button>' : 
                '<button class="t-btn" onclick="selT(this)">P</button><button class="t-btn" onclick="selT(this)">M</button><button class="t-btn" onclick="selT(this)">G</button><button class="t-btn" onclick="selT(this)">GG</button>'}


            </div>
            <button class="btn-comprar-p" onclick="adicionarAoCarrinho('${prod.nome}', '${prod.precoPix}', '${prod.img}')">COMPRAR AGORA</button>
        </div>`;
        
    document.getElementById('productModal').style.display = 'block';
    tamanhoSelecionado = "";

    
}

function renderCards(lista, container) {
    container.innerHTML = "";
    lista.forEach(p => {
        const data = JSON.stringify(p).replace(/"/g, '&quot;');
        container.innerHTML += `
            <div class="card-soft" onclick="openProductModal(${data})">
                <div class="img-container"><img src="${p.img}"></div>
                <span class="prod-nome">${p.nome}</span>
                <span class="prod-preco">${p.preco}</span>
            </div>`;
    });
}

function trocarFoto(el, s) { document.getElementById('mainImg').src = s; document.querySelectorAll('.mini-foto').forEach(m => m.classList.remove('active')); el.classList.add('active'); }
function selT(btn) { document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); tamanhoSelecionado = btn.innerText; }
function showPanel() { document.getElementById('sidePanel').classList.add('active'); document.getElementById('overlay').classList.add('active'); }
function togglePanel() { document.getElementById('sidePanel').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); }
function toggleCarrinho() { document.getElementById('carrinhoLateral').classList.toggle('active'); document.getElementById('cartOverlay').classList.toggle('active'); }
function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }

function finalizarCompra() {
    if (carrinho.length === 0) {
        mostrarAviso("⚠️ O CARRINHO ESTÁ VAZIO", true);
        return;
    }

    let msg = "🚀 *NOVO PEDIDO - LOJA NOME*\n";
    msg += "------------------------------------------\n\n";
    
    let totalGeral = 0;

    carrinho.forEach((item, index) => {
        // Converte o preço string "R$ 250,00" para número para calcular
        const precoNum = parseFloat(item.preco.replace('R$', '').replace('.', '').replace(',', '.'));
        const subtotalItem = precoNum * item.qtd;
        totalGeral += subtotalItem;

        msg += `*${index + 1}. ${item.nome}*\n`;
        msg += `   ▫️ Tam: ${item.tamanho}\n`;
        msg += `   ▫️ Qtd: ${item.qtd}x ${item.preco}\n`;
        msg += `   ▫️ Subtotal: *R$ ${subtotalItem.toFixed(2).replace('.', ',')}*\n\n`;
    });

    msg += "------------------------------------------\n";
    msg += `💰 *TOTAL DO PEDIDO: R$ ${totalGeral.toFixed(2).replace('.', ',')}*\n`;
    msg += "------------------------------------------\n\n";

<script>
// 1. Configuração do seu repositório
const repo = "zerognc009-cyber/NOVAFONTE"; 

// 2. Lista de produtos que será preenchida pelo painel
let produtosPorMarca = {
    "TÊNIS": [],
    "BONÉS": [],
    "ROUPAS": []
};

// 3. Função que busca os produtos que você cadastrou no /admin
async function carregarProdutosDoPainel() {
    try {
        console.log("Buscando produtos no GitHub...");
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/data/produtos`);
        
        if (!response.ok) {
            console.log("Ainda não existem produtos cadastrados ou a pasta está vazia.");
            return;
        }

        const arquivos = await response.json();

        for (let arquivo of arquivos) {
            if (arquivo.name === ".gitkeep") continue;
            
            const res = await fetch(arquivo.download_url);
            const produto = await res.json();
            
            // Organiza o produto na categoria certa (Tênis, Boné, etc)
            if (produtosPorMarca[produto.category]) {
                produtosPorMarca[produto.category].push(produto);
            }
        }

        // 4. AQUI VOCÊ CHAMA A SUA FUNÇÃO DE MOSTRAR OS CARDS
        // Se a sua função de criar os cards se chamar, por exemplo, 'renderizarLoja', coloque ela aqui:
        // renderizarLoja();
        
        console.log("Produtos carregados com sucesso!", produtosPorMarca);

    } catch (error) {
        console.error("Erro ao conectar com o painel:", error);
    }
}

// Inicia a carga assim que o site abre
document.addEventListener('DOMContentLoaded', carregarProdutosDoPainel);
</script>
